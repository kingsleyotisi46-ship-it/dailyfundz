services:
  - type: web
    name: dailyfundzboost
    runtime: python
    region: oregon
    plan: starter
    repo: https://github.com/kingsleyotisi46-ship-it/dailyfundz
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn DAILYFUNDZBOOST.wsgi:application
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,dailyfundzboost.trade,www.dailyfundzboost.trade"
      - key: SITE_URL
        value: "https://dailyfundzboost.trade"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://dailyfundzboost.trade,https://www.dailyfundzboost.trade"
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMM_PROVIDER_URL
        value: "https://justanotherpanel.com/api/v2"
      - key: SMM_PROVIDER_KEY
        sync: false
      - key: GRIZZLY_API_KEY
        sync: false
      - key: EMAIL_HOST
        value: "smtp.zoho.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: "admin@dailyfundzboost.trade"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "DAILYFUNDZBOOST <admin@dailyfundzboost.trade>"
      - key: ADMIN_NOTIFICATION_EMAIL
        value: "support@dailyfundzboost.trade"
